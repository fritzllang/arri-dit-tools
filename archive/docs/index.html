<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#15191f">
<title>ARRI DIT Tools</title>
<style>
:root{color-scheme:dark;--bg:#15191f;--bar:#20262e;--line:#39424e;--muted:#aeb7c2;--accent:#f2c14e}
*{box-sizing:border-box}
html,body{width:100%;height:100%;min-height:100%;margin:0;overflow:hidden;background:var(--bg);color:#f5f7fa;font:14px/1.35 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{display:flex;flex-direction:column}
.app-bar{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:14px;min-height:62px;padding:max(8px,env(safe-area-inset-top)) 14px 8px;background:var(--bar);border-bottom:1px solid var(--line)}
.brand{min-width:0;display:flex;align-items:center;gap:9px}
.mark{width:30px;height:30px;flex:0 0 30px;display:grid;place-items:center;border:1.5px solid var(--accent);border-radius:50%;color:var(--accent);font-size:17px;font-weight:750}
.brand-copy{min-width:0}
h1{margin:0;font-size:.91rem;line-height:1.1;letter-spacing:.055em;white-space:nowrap}
.subtitle{margin-top:3px;color:var(--muted);font-size:.68rem;white-space:nowrap}
nav{display:flex;align-items:center;gap:5px;min-width:0}
nav button{min-height:36px;padding:7px 11px;border:1px solid var(--line);border-radius:8px;background:transparent;color:#e8edf2;font:600 .76rem/1.15 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;white-space:nowrap;cursor:pointer;-webkit-tap-highlight-color:transparent}
nav button[aria-selected="true"]{color:#17191c;background:var(--accent);border-color:var(--accent)}
main{flex:1 1 auto;min-height:0;width:100%;display:flex;flex-direction:column;padding:5px 7px 7px}
.tool-actions{flex:0 0 auto;display:flex;justify-content:flex-end;align-items:center;min-height:27px;padding:0 2px 4px}
.external{display:inline-flex;align-items:center;gap:4px;min-height:23px;padding:3px 8px;border:1px solid rgba(242,193,78,.5);border-radius:6px;color:var(--accent);background:rgba(242,193,78,.08);font-size:.68rem;font-weight:650;text-decoration:none}
.frame-wrap{flex:1 1 auto;min-height:0;overflow:hidden;border-radius:7px;background:#fff}
iframe{display:block;width:100%;height:100%;border:0;background:#fff}
.fallback{display:none;min-height:100%;padding:22px;background:#f5f6f7;color:#1c222a}
@media(max-width:560px){
.app-bar{align-items:stretch;flex-direction:column;gap:7px;padding:max(7px,env(safe-area-inset-top)) 10px 8px}
.brand{gap:7px}.mark{width:25px;height:25px;flex-basis:25px;font-size:14px}
h1{font-size:.82rem}.subtitle{margin-top:1px;font-size:.62rem}
nav{width:100%}nav button{flex:1 1 0;min-width:0;min-height:34px;padding:6px 5px;font-size:.68rem}
main{padding:4px}.tool-actions{min-height:25px;padding-bottom:3px}
}
@media(max-width:350px){.subtitle{display:none}nav button{font-size:.63rem}}
</style>
</head>
<body>
<header class="app-bar">
  <div class="brand">
    <div class="mark" aria-hidden="true">A</div>
    <div class="brand-copy"><h1>ARRI DIT TOOLS</h1><div class="subtitle">Camera Prep Utilities</div></div>
  </div>
  <nav aria-label="Select ARRI tool">
    <button type="button" id="formatsTab" aria-controls="toolFrame" aria-selected="true">Formats &amp; Data Rate</button>
    <button type="button" id="frameTab" aria-controls="toolFrame" aria-selected="false">Frame Line &amp; Lens</button>
  </nav>
</header>
<main>
  <div class="tool-actions">
    <a class="external" id="openOriginal" href="https://tools.arri.com/fileadmin/adapps/afdc/index.html" target="_self">Open original ↗</a>
  </div>
  <section class="frame-wrap" aria-label="Selected ARRI tool">
    <iframe id="toolFrame" title="ARRI Formats and Data Rate Calculator"
      src="https://tools.arri.com/fileadmin/adapps/afdc/index.html"
      loading="eager" referrerpolicy="strict-origin-when-cross-origin"
      allow="clipboard-read; clipboard-write; fullscreen"></iframe>
  </section>
</main>
<script>
const tools={
  formats:{url:"https://tools.arri.com/fileadmin/adapps/afdc/index.html",title:"ARRI Formats and Data Rate Calculator"},
  frame:{url:"https://tools.arri.com/flt/",title:"ARRI Frame Line and Lens Illumination Tool"}
};
const frame=document.getElementById("toolFrame");
const original=document.getElementById("openOriginal");
const formatsTab=document.getElementById("formatsTab");
const frameTab=document.getElementById("frameTab");
let activeTool="formats";
function showTool(name){
  const tool=tools[name];
  if(!tool||name===activeTool)return;
  activeTool=name;
  frame.title=tool.title;
  frame.src=tool.url;
  original.href=tool.url;
  formatsTab.setAttribute("aria-selected",String(name==="formats"));
  frameTab.setAttribute("aria-selected",String(name==="frame"));
}
formatsTab.addEventListener("click",()=>showTool("formats"));
frameTab.addEventListener("click",()=>showTool("frame"));
</script>
</body>
</html>
